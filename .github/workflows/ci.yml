name: ci

# 183 recipes that CONSUMERS read over HTTP, and until this lane existed
# nothing checked one. An overlay recipe is not a build input we can retry:
# `pkgx` fetches it while resolving a closure, so a file that does not parse
# breaks every install of that project, silently, for everyone — with no build
# to go red first.
#
# This lane is deliberately narrow. It does not judge whether a recipe BUILDS;
# it judges whether a recipe can be READ, which is the failure this repository
# is uniquely able to cause.

on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recipes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with: { go-version: stable }

      # Read by the LOADER THE BUILDER USES — same formats, same schema, same
      # refusals — rather than by a script that re-states parts of the schema
      # in another language.
      #
      # The script this replaces did exactly what a second opinion eventually
      # does: it went looking for package.yml, found none the day these recipes
      # became HCL, and said "the layout changed". That is the mildest way the
      # divergence could have presented. The next one would have been a recipe
      # it judged fine and the builder could not read.
      #
      # `bk lint` FAILS on an empty tree. A sweep that cannot find its corpus
      # reports the same absence of problems as one that read it all, and the
      # count it prints is the only thing that tells the two apart.
      - name: every recipe can be read
        run: go run github.com/go-pkgx/bk/cmd/bk@main lint --dir .

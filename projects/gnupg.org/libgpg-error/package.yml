distributable:
  url: https://gnupg.org/ftp/gcrypt/libgpg-error/libgpg-error-{{version.raw}}.tar.gz
  strip-components: 1

versions:
  url: https://gnupg.org/ftp/gcrypt/libgpg-error/
  match: /libgpg-error-\d+\.\d+(\.\d+)?\.tar\.gz/
  strip:
    - /libgpg-error-/
    - /.tar.gz/

provides:
  - bin/gpg-error
  # Deprecated, but required for gpgme
  - bin/gpg-error-config
  - bin/gpgrt-config
  - bin/yat2m

dependencies:
  # libgpg-error links libintl and declares nothing, so a consumer's closure
  # never installs it. The shipped bottle carries both reference shapes — 8
  # full-versioned (@rpath/gnu.org/gettext/v1.0.0/…) and 6 major — so it needs a
  # rebuild as well as this line: a full-versioned reference resolves against no
  # gettext but the exact one it was built with.
  #
  # darwin only: linux resolves libintl through glibc and runs today.
  darwin:
    gnu.org/gettext: ^1

build:
  script:
    - run: |
        sed -i -e '/#include "gpgrt-int.h"/a\
        \
        #if defined (__APPLE__)\
        extern char** environ;\
        #endif' \
        spawn-posix.c
      if: ">=1.50"
      working-directory: src
    - ./configure --prefix={{prefix}} --enable-install-gpg-error-config
    - make
    - make check
    - make install

test:
  script: test "$(gpg-error 56)" = "$OUTPUT"
  env:
    OUTPUT: "56 = (0, 56) = (GPG_ERR_SOURCE_UNKNOWN, GPG_ERR_BAD_CERT_CHAIN) = (Unspecified source, Bad certificate chain)"

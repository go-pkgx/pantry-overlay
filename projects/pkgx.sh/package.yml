distributable:
  url: https://github.com/pkgxdev/pkgx/releases/download/v{{ version }}/pkgx-{{ version }}.tar.xz
  strip-components: 1

display-name: pkgx

versions:
  github: pkgxdev/pkgx

provides:
  - bin/pkgx

dependencies:
  darwin:
    # pkgx links liblzma on darwin and declares nothing, so an empty store gets
    # a binary that cannot start:
    #
    #   dyld: Library not loaded: @rpath/tukaani.org/xz/v5/lib/liblzma.5.dylib
    #     Referenced from: .../pkgx.sh/v2.11.0/bin/pkgx
    #
    # Its rpaths are fine — @loader_path/../../.. reaches the store root, where
    # tukaani.org/xz/v5 would be — so nothing is wrong with the bottle. The
    # closure simply never installs xz.
    #
    # Darwin only: the linux binary carries no liblzma reference at all
    # (checked on 2.11.0 linux/x86-64).
    tukaani.org/xz: ^5

build:
  dependencies:
    deno.land: ~2 # since 1.3.0
    rust-lang.org: ^1.56 # since 2.0
    perl.org: 5 # since 2.0
  # patchelf messes with Deno's ability to find the DATA block, making it
  # operate as only a bloated Deno binary
  skip: fix-patchelf
  script:
    - run: deno task --config "$SRCROOT"/deno.jsonc compile
      working-directory: ${{prefix}}/bin
      if: <2
    - run:
        - cargo install --path crates/cli --root "{{prefix}}"
        - strip '{{prefix}}/bin/pkgx'
      if: ">=2"
  env:
    linux/aarch64:
      # deno's pre-built runtime doesn't support glibc old enough
      DENORT_BIN: "{{deps.deno.land.prefix}}/bin/denort"
    linux:
      # llvm-ar is required for rust builds
      AR: llvm-ar
      # otherwise it complains about XZ_5.4 symbols
      LZMA_API_STATIC: 1

test: test "$(pkgx --version)" = "pkgx {{ version }}"

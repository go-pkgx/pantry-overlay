distributable:
  # since 2.16.0
  - url: https://gitlab.freedesktop.org/api/v4/projects/890/packages/generic/fontconfig/{{version.tag}}/fontconfig-{{version.tag}}.tar.xz
    strip-components: 1
  - url: https://www.freedesktop.org/software/fontconfig/release/fontconfig-{{ version }}.tar.xz
    strip-components: 1

versions:
  gitlab: gitlab.freedesktop.org:fontconfig/fontconfig/tags

dependencies:
  # fontconfig links libintl and declared nothing for it, so a bottle installed
  # into an empty store cannot start:
  #
  #   dyld: Library not loaded: @rpath/gnu.org/gettext/v1/lib/libintl.8.dylib
  #
  # The rebuilt bottle's references are all major-versioned, so the declaration
  # is the whole fix here. darwin only: linux resolves libintl through glibc.
  darwin:
    gnu.org/gettext: ^1
  sourceware.org/bzip2: 1
  freetype.org: 2
  zlib.net: 1
  gnome.org/libxml2: 2
  libexpat.github.io: 2

build:
  dependencies:
    gnu.org/gperf: 3
    python.org: '>=3<3.12'
  script:
    - ./configure --prefix={{ prefix }}
    - make --jobs {{ hw.concurrency }} install RUN_FC_CACHE_TEST=false
    - rm -rf {{prefix}}/share/doc

    - sed -i 's|<cachedir>{{prefix}}/var/cache/fontconfig</cachedir>|<cachedir prefix="relative">../../var/cache/fontconfig</cachedir>|' {{prefix}}/etc/fonts/fonts.conf

test: fc-list

provides:
  - bin/fc-cache
  - bin/fc-cat
  - bin/fc-conflist
  - bin/fc-list
  - bin/fc-match
  - bin/fc-pattern
  - bin/fc-query
  - bin/fc-scan
  - bin/fc-validate

distributable:
  url: https://github.com/NLnetLabs/unbound/archive/refs/tags/release-{{ version }}.tar.gz
  strip-components: 1

versions:
  github: NLnetLabs/unbound/tags
  strip: /^release-/

dependencies:
  openssl.org: ^3
  # unbound-anchor links libexpat to parse the DNSSEC root anchor, and expat
  # was declared under build.dependencies and nowhere else, so a closure that
  # installs unbound gets none of it:
  #
  #   unbound-anchor -> @rpath/libexpat.github.io/v2/lib/libexpat.1.12.3.dylib
  #
  # ^2 is the major that reference records. The PATCH-level leaf in it is a
  # separate defect only a rebuild fixes: bk now reduces a reference to the
  # soname its major line guarantees, so a rebuilt unbound names
  # libexpat.1.dylib and survives the next expat release.
  #
  # Folded in here rather than added as a second override: two patches on
  # adjacent lines of one block collide whichever order they apply in, and the
  # loser is skipped in silence.
  libexpat.github.io: ^2

build:
  dependencies:
    libexpat.github.io: '*'
    github.com/westes/flex: '*'
    gnu.org/bison: ^3

  script: |
    ./configure $ARGS
    make -j {{ hw.concurrency }} install

    cd {{prefix}}/bin
    sed -i.bak -e "s|$PKGX_DIR/|\$PKGX_DIR/|g" unbound-control-setup
    rm unbound-control-setup.bak
  env:
    # unbound probes for the FreeBSD spelling pthread_set_name_np by COMPILING a
    # call to it under -Werror, so an undeclared function MUST be an error for
    # the answer to mean anything. Our toolchain demotes that diagnostic for the
    # benefit of older recipes, which makes the probe always answer yes:
    # HAVE_PTHREAD_SET_NAME_NP gets defined and the link then fails on a symbol
    # glibc does not have. Re-promote it here, after the demotion.
    CFLAGS:  -Werror=implicit-function-declaration
    ARGS:
      - --prefix={{ prefix }}
      - --sbindir={{ prefix }}/bin
      - --with-ssl={{ deps.openssl.org.prefix }}
      - --with-libexpat={{ deps.libexpat.github.io.prefix }}

test:
  script:
    - unbound-control-setup -d .
    # The following tests complain on our build servers due to
    # darwin-specific configuration requirement
    - run: exit 0
      if: darwin
    - OUT="$(unbound-host tea.xyz)"
    - grep "$TEST1" <<< "$OUT"
    - grep "$TEST2" <<< "$OUT"
  env:
    TEST1: 'tea.xyz has address'
    TEST2: 'tea.xyz mail is handled by'

provides:
  - bin/unbound
  - bin/unbound-anchor
  - bin/unbound-checkconf
  - bin/unbound-control
  - bin/unbound-control-setup
  - bin/unbound-host

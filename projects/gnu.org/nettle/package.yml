distributable:
  url: https://ftp.gnu.org/gnu/nettle/nettle-{{version.raw}}.tar.gz
  strip-components: 1

versions:
  url: https://ftp.gnu.org/gnu/nettle
  match: /nettle-\d+(\.\d+)+\.tar\.gz/
  strip:
    - /^nettle-/
    - /\.tar\.gz$/

# What nettle LINKS, as opposed to what its build runs.
#
# gnu.org/gmp was declared under build.dependencies and nowhere else, so a
# closure that installs nettle gets no gmp — and libhogweed names it:
#
#   libhogweed.7.0.dylib -> @rpath/gnu.org/gmp/v6/lib/libgmp.10.dylib
#
# ^6 is the major that reference records, not a guess: gmp's soname on that
# line is libgmp.10, and v6 is what the bottle resolves through.
#
# Found by `bk undeclared`, which compares what every Mach-O in a closure LOADS
# against the declarations reachable from its own project.
dependencies:
  gnu.org/gmp: ^6

build:
  dependencies:
    gnu.org/gmp: "*"
    gnu.org/m4: "*"
  script:
    - ./configure --prefix={{ prefix }}
    - make --jobs {{ hw.concurrency }} install

test:
  - run: cc -lnettle -o test $FIXTURE
    if: <4
    fixture:
      extname: c
      content: |
        #include <nettle/sha1.h>
        #include <stdio.h>

        int main()
        {
          struct sha1_ctx ctx;
          uint8_t digest[SHA1_DIGEST_SIZE];
          unsigned i;

          sha1_init(&ctx);
          sha1_update(&ctx, 4, "test");
          sha1_digest(&ctx, SHA1_DIGEST_SIZE, digest);

          printf("SHA1(test)=");

          for (i = 0; i<SHA1_DIGEST_SIZE; i++)
            printf("%02x", digest[i]);

          printf("\\n");
          return 0;
        }
  - run: cc -lnettle -o test $FIXTURE
    if: ">=4"
    fixture:
      extname: c
      content: |
        #include <nettle/sha1.h>
        #include <stdio.h>

        int main()
        {
          struct sha1_ctx ctx;
          uint8_t digest[SHA1_DIGEST_SIZE];
          unsigned i;

          sha1_init(&ctx);
          sha1_update(&ctx, 4, "test");
          sha1_digest(&ctx, digest);

          printf("SHA1(test)=");

          for (i = 0; i<SHA1_DIGEST_SIZE; i++)
            printf("%02x", digest[i]);

          printf("\\n");
          return 0;
        }
  - ./test

provides:
  - bin/nettle-hash
  - bin/nettle-lfib-stream
  - bin/nettle-pbkdf2
  - bin/pkcs1-conv
  - bin/sexp-conv

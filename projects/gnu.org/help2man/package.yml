distributable:
  url: https://ftp.gnu.org/gnu/help2man/help2man-{{version}}.tar.xz
  strip-components: 1

versions:
  url: https://ftp.gnu.org/gnu/help2man/
  match: /help2man-\d+\.\d+\.\d+\.tar\.xz/
  strip:
    - /^help2man-/
    - /\.tar\.xz/

dependencies:
  # gettext renumbered 0.26 -> 1.0.0 and kept the same library (both ship
  # libintl.8.dylib). `^0` now excludes the current release, and help2man's
  # perl XS records the pkgx MAJOR in its reference:
  #   Library not loaded: @rpath/gnu.org/gettext/v0/lib/libintl.dylib
  # so it cannot load in an environment holding 1.0.0 — which is what
  # gnu.org/texinfo's build produces, since that recipe asks for `*`.
  # This is the BUILD half; the consumption half is pantry-overlay#24.
  gnu.org/gettext: '*'
  perl.org: ~5.44 # perl modules require matching minors; must match gettext

runtime:
  env:
    PERL5LIB: "{{prefix}}/lib/perl5:{{prefix}}/libexec/lib/perl5:$PERL5LIB"

build:
  dependencies:
    cpanmin.us: "*"
  script:
    # wrap cc so cpanm's XS link step gets -headerpad_max_install_names
    # (PERL_MM_OPT/OTHERLDFLAGS don't propagate through MakeMaker)
    - run:
        - WRAP=$(mktemp -d)
        - install -Dm755 $PROP $WRAP/cc
        - PATH="$WRAP:$PATH" CC="$WRAP/cc" cpanm -l {{prefix}} Locale::gettext
        - rm -rf "$WRAP"
      prop: |
        #!/bin/sh
        exec /usr/bin/cc -Wl,-headerpad_max_install_names -Wl,-rpath,{{pkgx.prefix}} "$@"
      if: darwin
    - run: cpanm -l {{prefix}} Locale::gettext
      if: linux
    - ./configure $CONFIGURE_ARGS
    - make install
    - run: sed -i '1s|.*|#!/usr/bin/env perl|' help2man
      working-directory: ${{prefix}}/bin
  env:
    PERL5LIB: "{{prefix}}/lib/perl5:{{prefix}}/libexec/lib/perl5:$PERL5LIB"
    CONFIGURE_ARGS:
      - --disable-debug
      - --disable-dependency-tracking
      - --prefix="{{prefix}}"
      - --libdir="{{prefix}}/lib"
    darwin:
      LDFLAGS: $LDFLAGS -Wl,-headerpad_max_install_names

provides:
  - bin/help2man

test:
  - help2man --version | grep {{version}}
  - help2man --locale=en_US.UTF-8 help2man | grep {{version}}

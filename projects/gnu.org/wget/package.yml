distributable:
  url: https://ftp.gnu.org/gnu/wget/wget-{{version}}.tar.gz
  strip-components: 1

versions:
  url: https://ftp.gnu.org/gnu/wget/
  match: /wget-(\d+\.\d+(\.\d+)?)\.tar\.gz/
  strip:
    - /wget-/
    - /.tar.gz/

provides:
  - bin/wget

dependencies:
  # ^3, not '*': this overlay exists so an INSTALL resolves what the published
  # bottle was actually LINKED against. libcurl.so.4 in the go-pkgx registry
  # NEEDs libssl.so.3 / libcrypto.so.3, so resolving openssl to 4.x installs a
  # runtime that cannot load it ("libssl.so.3: cannot open shared object file").
  # The upstream recipe's ^1.1 is unsatisfiable; '*' was too loose.
  openssl.org: ^3

build:
  dependencies:
    freedesktop.org/pkg-config: ^0.29
  script: |
    ./configure $ARGS
    make --jobs {{hw.concurrency}} install
  env:
    ARGS:
    - --prefix={{prefix}}
    - --disable-pcre
    - --disable-pcre2
    - --without-libps1
    - --without-included-regex
    - --with-ssl=openssl

test:
  wget tea.xyz

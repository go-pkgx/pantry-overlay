distributable:
   url: https://ftp.gnu.org/gnu/grep/grep-{{version.raw}}.tar.gz
   strip-components: 1

versions:
  url: https://ftp.gnu.org/gnu/grep/
  match: /grep-(\d+\.\d+(\.\d+)?)\.tar\.gz/
  strip:
    - /grep-/
    - /.tar.gz/

dependencies:
  pcre.org/v2: '*'

build:
  dependencies:
    freedesktop.org/pkg-config: ^0.29
    # Building GNU grep needs a working GNU grep: its own configure refuses
    # every other one —
    #
    #   configure: error: no working 'grep' found
    #     A working 'grep' command is needed to build GNU Grep.
    #     This 'grep' should support -e and long lines.
    #
    # and macOS's BSD grep does not satisfy it. bk keeps a package's own bottle
    # out of the base toolchain of its own build (it would shadow the thing
    # being built, and a broken copy would block its own replacement), so grep
    # has to ask for itself here, deliberately.
    #
    # And the published 3.12 only STARTS with this pcre2: it records
    # pcre.org/v2/v10.47/lib/libpcre2-8.0.dylib by absolute path, while the
    # runtime dependency below says '*' and resolves to 10.48. Without the pin
    # the tool is on PATH and cannot run, which reads as "no working grep" here
    # and as an Apple SDK type error over in nghttp2.
    #
    # Both lines are BOOTSTRAP scaffolding, not policy: the grep this produces
    # references @rpath/pcre.org/v2/v10/… (bk major-versions install names since
    # go-pkgx/bk#104), so the next rebuild needs neither.
    gnu.org/grep: '*'
    pcre.org/v2: =10.47
  script: |
    ./configure $ARGS
    make --jobs {{ hw.concurrency }} install
  env:
    ARGS:
      - --prefix={{prefix}}
      - --disable-nls
      - --mandir={{prefix}}/man
      - --infodir={{prefix}}/info
      - -with-packager=tea

provides:
  - bin/grep

test:
  fixture:
    This line should be matched
  script:
    grep -P match $FIXTURE
